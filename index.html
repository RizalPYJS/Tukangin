<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tukangin mempertemukan tukang dan penyedia jasa lokal dengan pelanggan di sekitarnya.">
<title>Tukangin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: app shell. Sticky top bar (desktop nav), content column max 1040px, fixed bottom tab bar on phones. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --sunk:#E7ECEA; --line:#D8DFDD;
  --fg:#152020; --muted:#566362; --soft:#7A8786;
  --accent:#B84505; --accent-fg:#FFFFFF; --accent-tint:#FBE4D6; --accent-text:#A63E04;
  --ok:#1E7A4C; --ok-tint:#DDF1E6; --warn:#8A5A00; --warn-tint:#FBEFD2; --bad:#B3261E; --bad-tint:#FADCD9; --info:#245FB8; --info-tint:#DDE8FA;
  --star:#C98400; --shadow:rgba(21,32,32,.14);
  --c-ac:#2F6FDE; --c-listrik:#C98400; --c-hp:#7A4FD6; --c-laptop:#0E8A78; --c-elektronik:#3C7D9C; --c-ledeng:#1F8FBF; --c-rumah:#8C6239; --c-taman:#4C8C2B; --c-pijat:#C2457A; --c-pindahan:#6B6F80;
  --map-bg:#E9EFEC; --map-grid:#D3DCD9;
  --sans:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1414; --surface:#162020; --sunk:#1E2A2A; --line:#2C3A3A;
  --fg:#E6ECEA; --muted:#A3B0AE; --soft:#83918F;
  --accent:#FF8A4C; --accent-fg:#1A0E07; --accent-tint:#3A2216; --accent-text:#FF9C66;
  --ok:#7BD3A3; --ok-tint:#173226; --warn:#F2C35B; --warn-tint:#352A12; --bad:#FF8A80; --bad-tint:#3A1A18; --info:#8CB4FF; --info-tint:#18263D;
  --star:#F5BE45; --shadow:rgba(0,0,0,.5);
  --c-ac:#7AA6FF; --c-listrik:#F2C35B; --c-hp:#B49BFF; --c-laptop:#4FD1BC; --c-elektronik:#7FC0DD; --c-ledeng:#6CC9F0; --c-rumah:#D7A97A; --c-taman:#93D16F; --c-pijat:#F48BB6; --c-pindahan:#A9AEC2;
  --map-bg:#132020; --map-grid:#223232; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1414; --surface:#162020; --sunk:#1E2A2A; --line:#2C3A3A;
  --fg:#E6ECEA; --muted:#A3B0AE; --soft:#83918F;
  --accent:#FF8A4C; --accent-fg:#1A0E07; --accent-tint:#3A2216; --accent-text:#FF9C66;
  --ok:#7BD3A3; --ok-tint:#173226; --warn:#F2C35B; --warn-tint:#352A12; --bad:#FF8A80; --bad-tint:#3A1A18; --info:#8CB4FF; --info-tint:#18263D;
  --star:#F5BE45; --shadow:rgba(0,0,0,.5);
  --c-ac:#7AA6FF; --c-listrik:#F2C35B; --c-hp:#B49BFF; --c-laptop:#4FD1BC; --c-elektronik:#7FC0DD; --c-ledeng:#6CC9F0; --c-rumah:#D7A97A; --c-taman:#93D16F; --c-pijat:#F48BB6; --c-pindahan:#A9AEC2;
  --map-bg:#132020; --map-grid:#223232; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent-text);font-weight:600}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar: logo, menu links, Hubungi Kami; menu collapses behind a toggle on phones */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-weight:800;font-size:21px;letter-spacing:-.03em}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.brand .mark svg{width:21px;height:21px;stroke:var(--accent-fg)}
.nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav button{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:10px;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;background:var(--accent)}
.nav .dot{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.nav .hk{margin-left:8px}
.menubtn{display:none;margin-left:auto;background:var(--sunk);border:0;border-radius:10px;width:42px;height:42px;place-items:center;cursor:pointer;color:var(--fg);position:relative}
.menubtn svg{width:22px;height:22px}
.menubtn .mdot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
@media (max-width:880px){
  .menubtn{display:grid}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;margin:0;flex-direction:column;align-items:stretch;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 18px 30px -20px var(--shadow);
    padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .nav.open{display:flex}
  .nav button{padding:13px 10px;font-size:16px}
  .nav button[aria-current="page"]{background:var(--sunk)}
  .nav button[aria-current="page"]::after{display:none}
  .nav .dot{margin-left:auto}
  .nav .hk{margin:8px 0 0}
}

main{min-height:60vh}
.view{padding-block:22px 48px;display:grid;gap:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.h1{font-size:clamp(26px,4.2vw,38px);font-weight:800}
.h2{font-size:22px;font-weight:800}
.lead{color:var(--muted);max-width:62ch;font-size:16px}
.back{justify-self:start;background:none;border:0;padding:4px 0;color:var(--accent-text);font-weight:700;cursor:pointer}

/* search */
.searchbar{display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.searchbar input{border:0;background:transparent;padding:10px 8px;min-width:0;font-size:16px}
.searchbar input:focus-visible{outline:none}
.searchbar:focus-within{border-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-weight:600;color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-fg);text-decoration:none;font-size:15px}
.btn svg{width:18px;height:18px}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.quiet{background:var(--sunk);color:var(--fg)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* provider list */
.count{font-size:13px;color:var(--muted);font-weight:600}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.pcard:hover{border-color:color-mix(in srgb,var(--fg) 30%,var(--line))}
.ptop{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start}
.cicon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 16%,var(--surface));color:var(--cc)}
.cicon svg{width:26px;height:26px}
.pname{font-weight:700;font-size:16px;line-height:1.3}
.pcat{font-size:13px;color:var(--muted);font-weight:600}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.stars{color:var(--star);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-tint);color:var(--ok)} .badge.warn{background:var(--warn-tint);color:var(--warn)}
.badge.bad{background:var(--bad-tint);color:var(--bad)} .badge.info{background:var(--info-tint);color:var(--info)} .badge.acc{background:var(--accent-tint);color:var(--accent-text)}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}
.notice b{color:var(--fg)}

/* map */
.mapbox{background:var(--map-bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}
.mk{cursor:pointer}
.mk:focus-visible{outline:none}
.mk:focus-visible circle.ring,.mk.sel circle.ring{stroke:var(--fg);stroke-width:3}

/* profile */
.phead{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center}
.phead .cicon{width:72px;height:72px;border-radius:18px}
.phead .cicon svg{width:38px;height:38px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.panel h3{font-size:16px;font-weight:800}
.kv{display:grid;grid-template-columns:118px 1fr;gap:8px 12px;margin:0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.svc{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.svc li{background:var(--sunk);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.callout{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--warn-tint);color:var(--fg)}
.callout.ok{background:var(--ok-tint)} .callout.info{background:var(--info-tint)}
.rev{display:grid;gap:3px;padding-top:12px;border-top:1px solid var(--line)}
.rev:first-child{border-top:0;padding-top:0}
.bigrate{display:flex;align-items:baseline;gap:8px}
.bigrate b{font-size:30px;font-weight:800}

/* forms */
form{display:grid;gap:14px}
.field{display:grid;gap:6px;font-weight:600;font-size:14px}
.field .hint{font-weight:500;font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=url],select.in,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
textarea{min-height:84px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-weight:600;font-size:14px}
.okmsg{color:var(--ok);font-weight:700;font-size:14px}
.rate{display:flex;gap:2px}
.rate button{background:none;border:0;font-size:34px;line-height:1;padding:2px;cursor:pointer;color:var(--line)}
.rate button.on{color:var(--star)}

/* orders */
.olist{display:grid;gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.ohead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.track div{display:grid;gap:5px;font-size:11px;font-weight:700;color:var(--soft)}
.track div::before{content:"";height:5px;border-radius:3px;background:var(--line)}
.track div.on{color:var(--fg)} .track div.on::before{background:var(--ok)}
.track div.now::before{background:var(--accent)}

/* admin */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:700;cursor:pointer;font-size:14px;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs .n{font-family:var(--mono);font-size:12px;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:600;color:var(--muted)}
.copyline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.copyline .mono{background:var(--sunk);padding:3px 8px;border-radius:7px;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}

/* landing (beranda): hero hashtag + finder + phone preview, availability strip, story, bridge, services, closing */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:center;padding-block:44px 28px}
.hero-copy{display:grid;gap:18px;min-width:0}
.hashtag{justify-self:start;font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--accent-text);background:var(--accent-tint);padding:6px 12px;border-radius:999px}
.tag{font-size:clamp(34px,5vw,58px);font-weight:800;letter-spacing:-.04em;line-height:1.05;display:grid;gap:4px}
.tag .prob{color:var(--accent-text);white-space:nowrap;transition:opacity .26s ease,transform .26s ease}
.tag .prob.out{opacity:0;transform:translateY(-6px)}
.sub{font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:50ch;display:grid;gap:6px}
.sub b{color:var(--fg);font-weight:700}
.finder{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;box-shadow:0 22px 40px -28px var(--shadow)}
.finder .kw{display:grid;grid-template-columns:1fr auto;gap:8px}
.finder .kw input{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:12px;min-width:0;font-size:16px}
.loc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.loc label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
.loc select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-weight:600;color:var(--fg);font-size:15px;min-width:0}
.phone{justify-self:center;width:min(300px,100%);border-radius:38px;padding:10px;background:var(--fg);box-shadow:0 30px 60px -30px var(--shadow)}
.screen{border-radius:30px;background:var(--bg);overflow:hidden;display:grid;gap:10px;padding:16px 12px 18px;min-height:440px;align-content:start}
.screen .bar{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:15px}
.screen .q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px;color:var(--soft);display:flex;gap:6px;align-items:center}
.screen .q svg{width:14px;height:14px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:36px 1fr;gap:9px;align-items:center;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.mini .cicon{width:36px;height:36px;border-radius:10px}.mini .cicon svg{width:20px;height:20px}
.mini b{font-size:12.5px;display:block;line-height:1.25}.mini span{font-size:11px;color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;padding-block:18px 40px;color:var(--muted);font-size:14px}
.strip .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.strip b{color:var(--fg);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-right:6px}
.hsec{border-top:1px solid var(--line);padding-block:64px}
.hsec h2{font-size:clamp(28px,4.2vw,44px);font-weight:800;letter-spacing:-.03em;max-width:20ch}
.hsec .kicker{font-size:16px;font-weight:700;color:var(--accent-text);margin-top:10px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.prose{display:grid;gap:14px;color:var(--muted);font-size:16px;max-width:60ch}
.prose b{color:var(--fg)}
.cover{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px}
.cover .now{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--ok-tint)}
.cover .now i{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 25%,transparent)}
.pvs{display:flex;flex-wrap:wrap;gap:6px}
.pvs span{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}
.pillar{border-top:3px solid var(--accent);padding-top:14px;display:grid;gap:6px;align-content:start}
.pillar h3{font-size:18px;font-weight:800}
.pillar p{color:var(--muted);font-size:15px}
.svcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:28px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;align-content:start}
.scard .cicon{width:52px;height:52px;border-radius:14px}
.scard small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.scard h3{font-size:19px;font-weight:800}
.scard p{color:var(--muted);font-size:14px}
.scard .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;flex-wrap:wrap}
.band{background:var(--fg);color:var(--bg);border-radius:24px;padding:clamp(24px,5vw,48px);display:grid;gap:16px;margin-top:40px}
.band h3{font-size:clamp(24px,3.6vw,36px);font-weight:800;letter-spacing:-.02em}
.band p{opacity:.8}
.band .btn.sec{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.closing{display:grid;gap:16px;justify-items:start}
/* photos: uploaded by admin; tinted icon panel until a photo exists */
.ph{display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 14%,var(--surface));color:var(--cc)}
.ph svg{width:44px;height:44px;opacity:.9}
.collage{display:grid;grid-template-columns:1.15fr 1fr;grid-auto-rows:170px;gap:10px}
.collage figure{margin:0;position:relative;border-radius:18px;overflow:hidden;min-width:0}
.collage figure:first-child{grid-row:span 2}
.collage .fill{position:absolute;inset:0}
.collage .fill img{width:100%;height:100%;object-fit:cover;display:block}
.collage figcaption{position:absolute;left:10px;bottom:10px;background:var(--surface);color:var(--fg);font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.scard .shot{margin:-18px -18px 6px;height:150px;border-radius:17px 17px 0 0;overflow:hidden}
.scard .shot img{width:100%;height:100%;object-fit:cover;display:block}
.pillar .step{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.model{display:grid;gap:16px}
.model div{display:grid;gap:4px;padding-left:16px;border-left:3px solid var(--accent)}
.model h3{font-size:18px;font-weight:800}
.model p{color:var(--muted);font-size:15px;max-width:56ch}
.metrics{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;width:100%}
.metrics ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.pcover{border-radius:var(--r);overflow:hidden;height:220px;border:1px solid var(--line)}
.pcover img{width:100%;height:100%;object-fit:cover;display:block}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.slot .shot{height:130px}.slot .shot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .in2{padding:12px;display:grid;gap:8px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
@media (max-width:880px){.collage{grid-auto-rows:130px}.pcover{height:170px}}
footer{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px}
footer .wrap{padding-block:40px 24px;display:grid;gap:28px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}
.fgrid h4{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);margin-bottom:10px}
.fgrid ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fgrid button.lnk{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font:inherit;text-align:left}
.fgrid a{color:var(--muted);font-weight:500}
.fbottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:18px;font-size:13px}
@media (max-width:880px){
  .hero{grid-template-columns:1fr;gap:28px;padding-block:28px 12px}
  .phone{width:min(280px,100%)}
  .screen{min-height:0}
  .two{grid-template-columns:1fr;gap:24px}
  .pillars{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .fgrid>div:first-child{grid-column:1/-1}
  .hsec{padding-block:48px}
}
@media (max-width:520px){.loc{grid-template-columns:1fr}.finder .kw{grid-template-columns:1fr}}


@media (max-width:760px){
  .top .wrap{padding-block:10px}
  .cols{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .kv{grid-template-columns:100px 1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .plist{grid-template-columns:1fr}
  .phead{grid-template-columns:60px 1fr}
  .phead .cicon{width:60px;height:60px}
}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.5}to{opacity:1}}}

function mapSvg(ps){
 const F='font-family:Plus Jakarta Sans,Arial,sans-serif';
 const pts=[...Object.values(KEC),...ps.map(p=>[p.lat,p.lng])];
 let la0=Math.min(...pts.map(p=>p[0])),la1=Math.max(...pts.map(p=>p[0])),lo0=Math.min(...pts.map(p=>p[1])),lo1=Math.max(...pts.map(p=>p[1]));
 const pad=.01;la0-=pad;la1+=pad;lo0-=pad;lo1+=pad;
 const W=Math.round(Math.max(330,Math.min(1006,document.documentElement.clientWidth-34)));
 const kx=Math.cos(6.9*Math.PI/180),H=Math.round(W*(la1-la0)/((lo1-lo0)*kx));
 const X=g=>(g-lo0)/(lo1-lo0)*W,Y=a=>(la1-a)/(la1-la0)*H;
 const kmPx=W/((lo1-lo0)*kx*111.32),big=W>640,fs=big?13:10.5,r=big?16:12;
 let grid='';for(let x=kmPx;x<W;x+=kmPx)grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;for(let y=kmPx;y<H;y+=kmPx)grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
 const placed=[[0,H-40,kmPx*2+70,H],[W-46,0,W,48],...ps.map(p=>{const x=X(p.lng),y=Y(p.lat);return[x-r-2,y-r-2,x+r+2,y+r+2]})];let labels='';
 KEC_NAMES.forEach(k=>{const [a,o]=KEC[k],x=X(o),y=Y(a),w=k.length*fs*.56,box=[x-w/2,y+4,x+w/2,y+6+fs*1.2];
  labels+=`<circle cx="${x}" cy="${y}" r="2.5" style="fill:var(--soft);opacity:.6"/>`;
  if(box[0]<2||box[2]>W-2||box[3]>H-2)return;
  if(placed.some(b=>!(box[2]<b[0]||box[0]>b[2]||box[3]<b[1]||box[1]>b[3])))return;
  placed.push(box);labels+=`<text x="${x}" y="${y+4+fs}" text-anchor="middle" style="font-size:${fs}px;font-weight:600;fill:var(--soft);${F}">${k}</text>`});
 let me='';if(S.myKec){const [a,o]=KEC[S.myKec],x=X(o),y=Y(a);me=`<g><title>Lokasi saya: Kec. ${S.myKec}</title><circle cx="${x}" cy="${y}" r="${r*1.6}" style="fill:var(--accent);opacity:.16"/><circle cx="${x}" cy="${y}" r="${r*.45}" style="fill:var(--accent);stroke:var(--surface);stroke-width:2.5"/></g>`}
 const ic=r*1.5/24;
 const marks=ps.map(p=>{const x=X(p.lng),y=Y(p.lat),c=`var(--c-${CAT[p.cat]?p.cat:'pindahan'})`;
  return `<g class="mk${S.mapSel===p.id?' sel':''}" tabindex="0" role="button" data-mk="${esc(p.id)}" aria-label="${esc(p.name)}, ${esc(CAT[p.cat]?.label||'')}">
   <circle class="ring" cx="${x}" cy="${y}" r="${r}" style="fill:${c};stroke:var(--surface);stroke-width:2.5"/>
   <g transform="translate(${x-12*ic} ${y-12*ic}) scale(${ic})" style="fill:none;stroke:var(--surface);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round">${ICON[p.cat]||ICON.rumah}</g></g>`}).join('');
 const sb=kmPx*2,by=H-16;
 return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Peta sebaran penyedia jasa">
  <rect width="${W}" height="${H}" style="fill:var(--map-bg)"/><g style="stroke:var(--map-grid);stroke-width:1">${grid}</g>${labels}${me}${marks}
  <g transform="translate(12 ${by})"><rect x="-6" y="-16" width="${sb+50}" height="26" rx="6" style="fill:var(--surface);opacity:.92"/><path d="M0 -5V3H${sb}V-5" style="fill:none;stroke:var(--fg);stroke-width:2"/><text x="${sb+8}" y="4" style="font-size:12px;font-weight:700;fill:var(--fg);${F}">2 km</text></g>
  <g transform="translate(${W-24} 26)"><circle r="16" style="fill:var(--surface);opacity:.92"/><path d="M0 -11 5 4 0 1 -5 4Z" style="fill:var(--fg)"/><text y="13" text-anchor="middle" style="font-size:8px;font-weight:800;fill:var(--fg);${F}">U</text></g>
 </svg>`;
}

   <div class="field"><span>Lokasi</span><div class="loc">${locSelects('n',e?.kec||'')}</div></div>
   <label class="field" for="n-addr">Alamat<input id="n-addr" type="text" value="${val('addr')}"></label>
   <div class="g2"><label class="field" for="n-co">Koordinat <span class="hint">Contoh -6.9201, 107.6489</span><input id="n-co" type="text" value="${e&&e.lat!=null?`${e.lat}, ${e.lng}`:''}"></label><label class="field" for="n-jam">Jam buka<input id="n-jam" type="text" placeholder="Buka 24 jam" value="${val('jam')}"></label></div>
   <div class="g2"><label class="field" for="n-gr">Rating Google <span class="hint">Opsional</span><input id="n-gr" type="text" inputmode="decimal" placeholder="4,9" value="${e?.gRating!=null?num(e.gRating):''}"></label><label class="field" for="n-gc">Jumlah ulasan Google<input id="n-gc" type="text" inputmode="numeric" placeholder="120" value="${e?.gCount||''}"></label></div>
   <label class="field" for="n-maps">Link Google Maps <span class="hint">Opsional${e?.placeId?'. Lokasi sudah terhubung ke Google Maps':''}</span><input id="n-maps" type="url" value="${val('mapsLink')}"></label>
   <label class="field" for="n-svc">Layanan <span class="hint">Pisahkan dengan koma. Kosongkan bila belum dikonfirmasi</span><textarea id="n-svc">${esc((e?.services||[]).join(', '))}</textarea></label>
   <div class="g2"><label class="field" for="n-phone">Nomor kontak (hanya admin)<input id="n-phone" type="tel" value="${esc(c.phone||'')}"></label><label class="field" for="n-st">Status<select class="in" id="n-st">${Object.entries(PSTAT).map(([k,[l]])=>`<option value="${k}" ${(e?.status||'aktif')===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
   <p class="err" id="n-err" hidden></p><button class="btn" type="submit">${e?'Simpan perubahan':'Simpan penyedia'}</button></form></div>`},
 after(){$('#f-add').addEventListener('submit',async ev=>{ev.preventDefault();const v=id=>$('#'+id).value.trim(),err=$('#n-err'),btn=ev.target.querySelector('[type=submit]');
  const co=parseCo(v('n-co'));
  const msg=!v('n-name')?'Isi nama usaha.':!v('n-kec')?'Pilih kecamatan.':(v('n-co')&&!co)?'Format koordinat belum benar. Contoh: -6.9201, 107.6489':'';
  if(msg){err.textContent=msg;err.hidden=false;return}
  const gr=parseFloat(v('n-gr').replace(',','.')),gc=parseInt(v('n-gc').replace(/\D/g,''));
  const e0=S.param?S.providers.get(S.param):null;
  const data={name:v('n-name'),cat:v('n-cat'),prov:e0?.prov||LIVE.prov,kota:e0?.kota||LIVE.kota,kec:v('n-kec'),addr:v('n-addr'),lat:co?co[0]:null,lng:co?co[1]:null,jam:v('n-jam'),mapsLink:v('n-maps'),
   services:v('n-svc')?v('n-svc').split(',').map(s=>s.trim()).filter(Boolean):[],gRating:isNaN(gr)?null:gr,gCount:isNaN(gc)?0:gc,status:v('n-st')};
  btn.disabled=true;
  try{const id=S.param||(v('n-name').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)+'-'+Date.now().toString(36).slice(-4));
   if(S.param)await api.updateProvider(id,data);else await api.insertProvider(id,{...data,source:'admin'});
   if(v('n-phone')!==(S.contacts[id]?.phone||''))await putContact(id,v('n-phone'));
   await reload();
   toast(S.param?'Perubahan tersimpan':'Penyedia tersimpan');S.adminTab='penyedia';go('admin')}
  catch(ex){btn.disabled=false;err.textContent=writeError(ex);err.hidden=false}})}};
function parseCo(s){const m=String(s).match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);if(!m)return null;const a=+m[1],o=+m[2];return(a<-5.5&&a>-8&&o>106&&o<109)?[a,o]:null}
async function putContact(pid,phone){await api.setContact(pid,phone)}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go,g.dataset.p||null);return}
 const sc=e.target.closest('[data-scroll]');if(sc){document.getElementById(sc.dataset.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}
 if(e.target.closest('#menubtn')){$('#nav').classList.toggle('open');renderNav();return}
 const cp=e.target.closest('[data-copy]');if(cp){copy(cp.dataset.copy);return}
 const fl=e.target.closest('[data-flt]');if(fl){S[fl.dataset.flt]=!S[fl.dataset.flt];fl.setAttribute('aria-pressed',S[fl.dataset.flt]);VIEWS.cari.update();return}
 const c=e.target.closest('[data-cat]');if(c){S.cat=c.dataset.cat;if(S.view==='cari'){document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cat===S.cat));VIEWS.cari.update()}else render();return}
 const mk=e.target.closest('[data-mk]');if(mk){S.mapSel=mk.dataset.mk;render();return}
 const tab=e.target.closest('[data-tab]');if(tab){S.adminTab=tab.dataset.tab;render();return}
 const a=e.target.closest('[data-act]');
 if(a?.dataset.act==='search'){S.q=$('#q').value.trim();VIEWS.cari.update();return}
 if(a?.dataset.act==='cancel'){a.disabled=true;if(!await act(()=>api.cancelOrder(a.dataset.o),'Pesanan dibatalkan'))a.disabled=false;return}
 if(a?.dataset.act==='savewa'){const g=id=>$('#'+id).value.trim(),v=g('set-wa'),li=g('set-li'),em=g('set-email'),err=$('#set-err');
  const msg=(v&&v.replace(/\D/g,'').length<10)?'Nomor WhatsApp minimal 10 angka.':(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))?'Format email belum benar.':(li&&!/^https:\/\/(www\.)?linkedin\.com\//.test(li))?'Link LinkedIn harus diawali https://www.linkedin.com/':'';
  if(msg){err.textContent=msg;err.hidden=false;return}
  try{await api.saveSettings({wa_number:v,email:em,instagram:g('set-ig').replace(/^@/,''),linkedin:li});await reload();['set-wa','set-email','set-ig','set-li'].forEach(k=>delete S.drafts[k]);err.hidden=true;toast('Tersimpan')}catch(ex){err.textContent=writeError(ex);err.hidden=false}return}
 if(a?.dataset.act==='logout'){a.disabled=true;try{await sb.auth.signOut()}catch(ex){}await applySession(null);await reload();toast('Kamu sudah keluar');go('beranda');return}
 if(a?.dataset.act==='homesearch'){S.q=$('#h-q').value.trim();go('cari');return}
 if(a?.dataset.act==='seecat'){S.cat=a.dataset.c;S.q='';go('cari');return}
 const on=e.target.closest('[data-onote]');if(on){const [owner,id]=on.dataset.onote.split('|'),val=$('#nt-'+CSS.escape(on.dataset.onote)).value.trim();
  try{await api.updateOrder(id,{admin_note:val||null});delete S.drafts['nt-'+on.dataset.onote];await reload();toast('Catatan tersimpan')}catch(ex){toast(writeError(ex))}return}
 if(a?.dataset.act==='pfmore'){S.pf.n+=20;render();return}
 if(a?.dataset.act==='pfsearch'){S.pf.q=$('#pf-q').value.trim();S.pf.n=20;render();return}
 const pn=e.target.closest('[data-pnote]');if(pn){const id=pn.dataset.pnote,val=$('#pn-'+CSS.escape(id)).value.trim();
  try{await api.updateProspect(id,{note:val||null});delete S.drafts['pn-'+id];await reload();toast('Catatan tersimpan')}catch(ex){toast(writeError(ex))}return}
 const pm=e.target.closest('[data-pmitra]');if(pm){const id=pm.dataset.pmitra;
  if(S.armed!==id){S.armed=id;render();setTimeout(()=>{if(S.armed===id){S.armed=null;if(S.view==='admin')render()}},6000);return}
  S.armed=null;pm.disabled=true;try{await activateProspect(id);toast('Mitra ditayangkan di Tukangin')}catch(ex){pm.disabled=false;toast(writeError(ex))}return}
 const rc=e.target.closest('[data-rmcat]');if(rc){const c=rc.dataset.rmcat,old=photoId(c),ph={...(S.config.photos||{})};delete ph[c];rc.disabled=true;
  try{await api.saveSettings({photos:ph});if(old)api.deletePhoto(old);await reload();toast('Foto dihapus')}catch(ex){rc.disabled=false;toast(writeError(ex))}return}
 const pc=e.target.closest('[data-pcontact]');if(pc){const id=pc.dataset.pcontact,val=$('#pc-'+CSS.escape(id)).value.trim();try{await putContact(id,val);delete S.drafts['pc-'+id];await reload();toast('Nomor tersimpan')}catch(ex){toast(writeError(ex))}return}
 const ap=e.target.closest('[data-approve]');if(ap){const key=ap.dataset.approve,[owner,id]=key.split('|'),app=S.allApps.find(x=>x.owner===owner&&x.id===id),err=$('#ae-'+CSS.escape(key));
  const raw=$('#co-'+CSS.escape(key)).value.trim(),co=parseCo(raw);if(raw&&!co){err.textContent='Format koordinat belum benar. Contoh: -6.9201, 107.6489';err.hidden=false;return}
  ap.disabled=true;const pid='m-'+id.toLowerCase();
  try{await api.insertProvider(pid,{name:app.name,cat:app.cat,prov:app.prov||LIVE.prov,kota:app.kota||LIVE.kota,kec:app.kec,addr:app.addr||'',lat:co?co[0]:null,lng:co?co[1]:null,jam:app.jam||'',mapsLink:app.mapsLink||'',services:app.services||[],gRating:null,gCount:0,status:'aktif',source:'pendaftaran',createdAt:new Date().toISOString()});
   await putContact(pid,app.wa);
   await api.updateApp(id,{status:'disetujui',provider_id:pid});await reload();toast('Mitra disetujui dan tampil')}
  catch(ex){ap.disabled=false;err.textContent=writeError(ex);err.hidden=false}return}
 const rj=e.target.closest('[data-reject]');if(rj){const [owner,id]=rj.dataset.reject.split('|');await act(()=>api.updateApp(id,{status:'ditolak'}),'Pendaftaran ditolak');return}
});
document.addEventListener('keydown',e=>{
 const gk=e.target.closest?.('article[data-go]');if(gk&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go(gk.dataset.go,gk.dataset.p||null);return}
 if(e.key==='Enter'&&e.target.id==='q'){S.q=e.target.value.trim();VIEWS.cari.update()}
 if(e.key==='Enter'&&e.target.id==='pf-q'){S.pf.q=e.target.value.trim();S.pf.n=20;e.target.blur();render()}
 if(e.key==='Enter'&&e.target.id==='h-q'){S.q=e.target.value.trim();go('cari')}
 if(e.key==='Escape'&&$('#nav').classList.contains('open')){$('#nav').classList.remove('open');renderNav();$('#menubtn').focus()}
 const mk=e.target.closest?.('[data-mk]');if(mk&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.mapSel=mk.dataset.mk;render()}
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.dataset.upcat||t.dataset.upprov){const f=t.files?.[0];if(!f)return;
  if(!S.isAdmin){toast('Hanya admin yang bisa mengunggah foto.');return}
  if(!/^image\//.test(f.type)){toast('Pilih file gambar, misalnya JPG atau PNG.');t.value='';return}
  toast('Mengunggah foto…');
  try{const blob=await shrink(f),path=await api.uploadPhoto(blob);
   if(t.dataset.upcat){const c=t.dataset.upcat,old=photoId(c);await api.saveSettings({photos:{...(S.config.photos||{}),[c]:path}});if(old)api.deletePhoto(old)}
   else{const pid=t.dataset.upprov,old=S.providers.get(pid)?.photo;await api.updateProvider(pid,{photo:path});if(old)api.deletePhoto(old)}
   await reload();toast('Foto tersimpan')}
  catch(ex){console.warn(ex);toast(/exceed|too large|payload/i.test(ex?.message||'')?'Foto terlalu besar. Pilih foto yang lebih kecil.':writeError(ex))}
  t.value='';t.blur();return}
 if(t.id==='f-kec'||t.id==='h-kec'){S.myKec=t.value;store.set('tk-kec',t.value);if(t.value&&S.view==='cari'){S.sort='dekat';const s=$('#sort');if(s)s.value='dekat'}if(S.view==='peta')render();else VIEWS[S.view].update?.();return}
 if(t.id==='sort'){S.sort=t.value;VIEWS.cari.update();return}
 if(t.id==='pf-st'||t.id==='pf-cat'){S.pf[t.id==='pf-st'?'st':'cat']=t.value;S.pf.n=20;t.blur();render();return}
 if(t.dataset.pstat){const id=t.dataset.pstat;t.disabled=true;await act(()=>api.updateProspect(id,{cstatus:t.value}),'Hasil kontak: '+PST[t.value][0]);t.disabled=false;t.blur();return}
 if(t.id==='ofilter'){S.ofilter=t.value;t.blur();render();return}
 if(t.dataset.ostatus){const [owner,id]=t.dataset.ostatus.split('|');t.disabled=true;
  await act(()=>api.updateOrder(id,{status:t.value}),'Status: '+OS[t.value].label);t.disabled=false;t.blur();return}
 if(t.dataset.pstatus){t.disabled=true;await act(()=>api.updateProvider(t.dataset.pstatus,{status:t.value}),'Status penyedia diperbarui');t.disabled=false;t.blur()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'&&!e.target.value){S.q='';VIEWS.cari.update()}});

let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.view==='peta')refresh()},200)});
/* ---------- boot ---------- */
async function boot(){
 renderNav();go(location.hash==='#admin'?'masuk':'beranda');
 if(!window.supabase||/^GANTI/.test(SUPABASE_URL)||/^GANTI/.test(SUPABASE_ANON_KEY)){S.dbState='none';refresh();return}
 /* Ubah Headers menjadi objek biasa: beberapa tampilan pratinjau meneruskan fetch lewat postMessage dan tidak bisa menyalin objek Headers. */
 const plainFetch=(input,init={})=>{const o={...init};
  if(o.headers&&typeof o.headers.forEach==='function'&&!Array.isArray(o.headers)){const h={};o.headers.forEach((v,k)=>{h[k]=v});o.headers=h}
  if(o.signal==null)delete o.signal;return fetch(input,o)};
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true},global:{fetch:plainFetch}});
 try{const {data}=await sb.auth.getSession();await applySession(data.session)}catch(e){console.warn(e)}
 if(S.view==='masuk')render();
 await reload();
 if(S.view==='masuk'&&S.isAdmin)go('admin');
 setInterval(()=>{if(document.visibilityState==='visible')reload()},30000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reload()});
}
window.addEventListener('hashchange',()=>{if(location.hash==='#admin')go(S.isAdmin?'admin':'masuk')});
boot();
</script>
